<footer class="site-footer">
  <div class="container footer-inner">

    <div class="footer-col footer-brand">
      <div class="brand">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <line x1="16" y1="16" x2="28" y2="16" stroke="currentColor" stroke-width="2"/>
          <line x1="16" y1="16" x2="16" y2="2" stroke="currentColor" stroke-width="2"/>
          <line x1="16" y1="16" x2="4" y2="16" stroke="currentColor" stroke-width="2"/>
          <circle cx="16" cy="16" r="3" fill="currentColor"/>
        </svg>
        <span>velotech</span>
      </div>
      <p class="tagline">Plateforme de gestion pour magasins de velo.</p>
    </div>

    <div class="footer-col">
      <h4>Liens</h4>
      <ul>
        <li><a routerLink="/about">A propos</a></li>
        <li><a routerLink="/stores">Magasins</a></li>
        <li><a routerLink="/contact">Contact</a></li>
      </ul>
    </div>

    <div class="footer-col">
      <h4>Legal</h4>
      <ul>
        <li><a routerLink="/legal/cgv">CGV</a></li>
        <li><a routerLink="/legal/cgu">CGU</a></li>
        <li><a routerLink="/legal">Mentions legales</a></li>
        <li><a routerLink="/legal/rgpd">RGPD</a></li>
      </ul>
    </div>

    <div class="footer-col">
      <h4>Newsletter</h4>
      <p class="newsletter-text">Recevez nos bons plans et nouveautes.</p>
      <form class="newsletter-form" (submit)="$event.preventDefault()">
        <input type="email" placeholder="votre@email.com" aria-label="Votre email" />
        <button type="submit" class="btn btn-primary btn-sm" aria-label="S'abonner">→</button>
      </form>
    </div>

  </div>

  <div class="footer-bottom">
    <div class="container">
      <p>© {{ currentYear }} Velotech — Tous droits reserves</p>
    </div>
  </div>
</footer>
