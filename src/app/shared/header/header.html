<header class="site-header">
  <div class="container header-inner">

    <!-- Logo -->
    <a routerLink="/" class="logo" aria-label="Velotech - Accueil">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <line x1="16" y1="16" x2="28" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="16" x2="24.5" y2="24.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="16" x2="16" y2="30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="16" x2="7.5" y2="24.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="16" x2="4" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="16" x2="7.5" y2="7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="16" x2="16" y2="2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="16" x2="24.5" y2="7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="16" cy="16" r="3" fill="currentColor"/>
      </svg>
      <span class="logo-text">velotech</span>
    </a>

    <!-- Navigation -->
    <nav class="nav" aria-label="Navigation principale">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Accueil</a>
      <a routerLink="/catalog/1" routerLinkActive="active">Catalogue</a>
      <a routerLink="/stores" routerLinkActive="active">Magasins</a>
      <a routerLink="/about" routerLinkActive="active">A propos</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
    </nav>

    <!-- Actions -->
    <div class="actions">
      <a routerLink="/cart" class="icon-btn" aria-label="Mon panier">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h3l3 14h14l3-10H7"/>
          <circle cx="10" cy="22" r="1.5"/>
          <circle cx="20" cy="22" r="1.5"/>
        </svg>
        <span class="cart-badge" *ngIf="cartCount() > 0">{{ cartCount() }}</span>
      </a>

      <ng-container *ngIf="!isLoggedIn; else loggedActions">
        <a routerLink="/login" class="btn btn-secondary btn-sm">Se connecter</a>
      </ng-container>

      <ng-template #loggedActions>
        <a [routerLink]="dashboardLink" class="btn btn-outline btn-sm">Mon espace</a>
        <button class="btn btn-ghost btn-sm" (click)="logout()" aria-label="Se deconnecter">
          Deconnexion
        </button>
      </ng-template>
    </div>

  </div>
</header>
